name: Order Service CI

on:
  push:
    branches:
      - main
    paths:
      - "order-service/**"
      - ".github/workflows/order-service.yml"
  pull_request:
    branches:
      - main
    paths:
      - "order-service/**"
      - ".github/workflows/order-service.yml"
  workflow_dispatch:

# Requirement 7: Default workflow permissions set to least privilege
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # If this job were publishing packages, you would place `permissions: packages: write` here.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi starlette requests httpx pytest
          if [ -f order-service/requirements-dev.txt ]; then pip install -r order-service/requirements-dev.txt; fi

      - name: Run tests
        run: |
          PYTHONPATH=order-service pytest order-service/tests

