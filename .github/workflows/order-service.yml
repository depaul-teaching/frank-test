name: Order Service CI

on:
  push:
    branches:
      - main
    paths:
      - "order-service/**"
      - ".github/workflows/order-service.yml"
  pull_request:
    branches:
      - main
    paths:
      - "order-service/**"
      - ".github/workflows/order-service.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi starlette requests httpx pytest
          if [ -f order-service/requirements-dev.txt ]; then pip install -r order-service/requirements-dev.txt; fi

      - name: Run tests
        run: |
          PYTHONPATH=order-service pytest order-service/tests

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build step placeholder
        run: echo "Build and push placeholder - tests passed!"

