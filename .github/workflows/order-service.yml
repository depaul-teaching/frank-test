name: Order Service CI

on:
  push:
    branches:
      - main
    paths:
      - "order-service/**"
      - ".github/workflows/order-service.yml"
  pull_request:
    branches:
      - main
    paths:
      - "order-service/**"
      - ".github/workflows/order-service.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r order-service/requirements-dev.txt
      - name: Run tests
        run: |
          pytest order-service/tests

