name: Order Service CI

on:
  push:
    branches:
      - main
    paths:
      - "order-service/**"
      - ".github/workflows/order-service.yml"
  pull_request:
    branches:
      - main
    paths:
      - "order-service/**"
      - ".github/workflows/order-service.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi starlette requests httpx pytest
          if [ -f order-service/requirements-dev.txt ]; then pip install -r order-service/requirements-dev.txt; fi

      - name: Run tests
        run: |
          PYTHONPATH=order-service pytest order-service/tests

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Metadata Action
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/depaul-teaching/frank-test/order-service
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./order-service
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

